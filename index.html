<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ユーザーポータルテスト</title>

    <!-- リセットCSS & Googleフォントやアイコンなど -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/destyle.css@4.0.0/destyle.min.css" />
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://kit.fontawesome.com/d36bec305b.js" crossorigin="anonymous"></script>

    <script src="assets/js/main.js" type="module"></script>
</head>

<body>
    <!-- スペース用サンプルここから -->
    <img src="http://www.google.com/s2/favicons?domain=https://www.taniweb.jp/" alt="">
    <img src="http://www.google.com/s2/favicons?domain=https://www.taniweb.jp/" alt="">
    <!-- スペース用サンプルここまで -->

    <!-- メインレイアウトのベース -->
    <div class="c-main">
        <!-- 💡 外部から読み込むヘッダー（ワールドセレクター）の受け皿 -->
        <div id="js-world-selector-container" class="c-main__header js-header-container"></div>

        <!-- ヒーローエリア（タイトルやログインボタンなど） -->
        <div class="c-main__hero">
            <!-- ここにログイン前/後のメインビジュアルを配置 -->
        </div>

        <!-- 💡 各タブ（SPA）のコンテンツが動的に表示されるメインコンテナ -->
        <main class="c-main__container js-main-content">
            <!-- 
                JavaScriptでここに 
                portal.html, diamond.html, character.html, arcana.html 
                などの中身を非同期で流し込む、または最初から全タブ分を非表示で置いておく 
                -->
        </main>
    </div>

    <!-- 外部から読み込むフッターの受け皿 -->
    <footer id="js-footer-container" class="c-footer js-footer-container">


    </footer>

</body>

</html>
