<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ユーザーポータルテスト</title>

    <!-- リセットCSS & Googleフォントやアイコンなど -->
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/destyle.css@4.0.0/destyle.min.css" />
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/portal.css">
    <script src="https://kit.fontawesome.com/d36bec305b.js" crossorigin="anonymous"></script>

    <script src="assets/js/main.js" type="module"></script>
    <script src="assets/js/portal.js"></script>
</head>

<body>
    <div class="l-container">
        <header class="l-header c-floating-header">
            <div id="js-world-selector-container" class="c-main__header js-header-container"></div>
        </header>
        <main class="l-main p-portal">

            <div class="p-portal-main">

                <div class="p-portal__content">
                    <div class="p-portal-wrapper">

                        <div class="p-portal-main__left">

                            <div class="p-portal-progress">
                                <div class="p-portal-progress__box m-quest-box">
                                    <span class="p-portal-progress__label">クエスト</span>
                                    <div class="p-portal-quest-input-group">
                                        <input type="number" id="js-portal-quest-chapter"
                                            class="p-portal-input m-center" placeholder="0" min="1">
                                        <span class="p-portal-quest-separator">-</span>
                                        <input type="number" id="js-portal-quest-stage" class="p-portal-input m-center"
                                            placeholder="0" min="1">
                                    </div>
                                </div>
                                <div class="p-portal-progress__box">
                                    <span class="p-portal-progress__label">無窮の塔</span>
                                    <input type="number" id="js-portal-muguu" class="p-portal-input m-center"
                                        placeholder="0" min="0">
                                </div>
                            </div>

                            <div class="p-portal-towers">
                                <div class="p-portal-towers__box m-blue">
                                    <span class="p-portal-towers__label">藍の塔</span>
                                    <input type="number" id="js-portal-tower-blue" class="p-portal-tower-input"
                                        placeholder="0" min="0">
                                </div>
                                <div class="p-portal-towers__box m-red">
                                    <span class="p-portal-towers__label">紅の塔</span>
                                    <input type="number" id="js-portal-tower-red" class="p-portal-tower-input"
                                        placeholder="0" min="0">
                                </div>
                                <div class="p-portal-towers__box m-green">
                                    <span class="p-portal-towers__label">翠の塔</span>
                                    <input type="number" id="js-portal-tower-green" class="p-portal-tower-input"
                                        placeholder="0" min="0">
                                </div>
                                <div class="p-portal-towers__box m-yellow">
                                    <span class="p-portal-towers__label">黄の塔</span>
                                    <input type="number" id="js-portal-tower-yellow" class="p-portal-tower-input"
                                        placeholder="0" min="0">
                                </div>
                            </div>

                            <div class="p-portal-memo">
                                <h4 class="p-portal-memo__title">ワールド活動メモ</h4>
                                <textarea id="js-portal-world-memo" class="p-portal-textarea" placeholder="自由に記述できます"
                                    rows="3"></textarea>
                            </div>

                        </div>

                        <div class="p-portal-main__right">
                            <div class="p-portal-party-container">
                                <header class="p-portal-party-container__header">
                                    <h4 class="p-portal-party-container__title">
                                        <i class="fa-solid fa-shield-halved"></i> パーティー編成
                                    </h4>
                                    <button type="button" id="js-portal-btn-add-party"
                                        class="c-btn p-portal-party-container__add-btn">
                                        <i class="fa-solid fa-plus"></i> 追加
                                    </button>
                                </header>

                                <!-- 👥 ここに登録されたパーティリストが動的にJavaScriptでレンダリングされます -->
                                <div id="js-portal-party-list" class="p-portal-party-list"></div>
                            </div>
                        </div>


                    </div>

                    <div class="p-portal-settings-accordion">
                        <button type="button" id="js-portal-settings-toggle" class="p-portal-settings-toggle">
                            <i class="fa-solid fa-gear"></i> ワールドの詳細設定を編集
                        </button>

                        <div id="js-portal-settings-content" class="p-portal-settings-content">
                            <div class="p-portal-settings-grid">
                                <div class="p-portal-settings-field">
                                    <label class="p-portal-settings-label">ワールドのアイコン</label>

                                    <button type="button" id="js-portal-character-trigger"
                                        class="p-portal-chara-btn js-open-character-picker"
                                        data-target-input="js-portal-setting-character-id"
                                        data-target-preview="js-portal-setting-icon-preview">
                                        <img id="js-portal-setting-icon-preview" src="assets/images/chara-icon/1.webp"
                                            alt="キャラクターアイコン">
                                    </button>


                                    <input type="hidden" id="js-portal-setting-character-id" value="">
                                </div>
                                <div class="p-portal-settings-field">
                                    <label class="p-portal-settings-label">ワールド名</label>
                                    <input type="text" id="js-portal-setting-name" class="p-portal-input"
                                        placeholder="例：新プレイヤー">
                                </div>
                                <div class="p-portal-settings-field">
                                    <label class="p-portal-settings-label">開始日</label>
                                    <input type="date" id="js-portal-setting-start-date" class="p-portal-input">
                                </div>
                                <div class="p-portal-settings-field">
                                    <label class="p-portal-settings-label">外部リンクURL</label>
                                    <input type="url" id="js-portal-setting-link" class="p-portal-input"
                                        placeholder="https://notion.so...">
                                </div>
                                <div class="p-portal-settings-field">
                                    <label class="p-portal-settings-label">ワールドのステータス</label>
                                    <div class="p-portal-select">
                                        <select id="js-portal-setting-status" class="p-portal-select__input">
                                            <option value="active" selected>有効</option>
                                            <option value="archived">無効（アーカイブ）</option>
                                        </select>
                                    </div>
                                </div>

                            </div>

                            <div class="c-world-form__item p-portal-delete-zone">
                                <p class="p-portal-delete-zone__alert">⚠️ この操作は取り消せません</p>
                                <button type="button" id="js-portal-btn-delete-world"
                                    class="c-btn p-portal-delete-zone__btn">
                                    <i class="fa-solid fa-trash-can"></i> このワールドを削除する
                                </button>
                            </div>


                        </div>
                    </div>
                    <div class="p-portal-footer">
                        <span id="js-portal-world-updated">最終更新: ──</span>
                        <div class="p-portal-actions">
                            <a id="js-portal-external-link" href="https://notion.com"
                                class="p-portal-footer__external-link-btn" target="_blank">
                                <img src="http://google.com"> 外部リンク
                            </a>

                        </div>
                    </div>
                </div>
            </div>
            <div class="c-update-btn__wrapper">
                <div class="c-update-btn__wrap">
                    <button type="button" id="js-portal-btn-update" class="c-btn c-update-btn">
                        <i class="fa-solid fa-rotate"></i> 更新する
                    </button>
                </div>
            </div>

            <!-- 🔲 共通部品：パーティ編集用モーダル -->
            <div id="js-party-edit-modal" class="c-modal c-party-edit-modal c-world-modal" aria-hidden="true" inert>
                <div class="c-modal__overlay js-party-edit-modal-close"></div>
                <div class="c-world-modal__container c-modal__container">
                    <header class="c-world-modal__header">
                        <div class="c-account-modal__title-wrap">
                            <i class="fa-solid fa-pen-to-square"></i>
                            <span class="c-account-modal__title">パーティ編成の編集</span>
                        </div>
                        <button type="button"
                            class="c-world-modal__close-btn js-party-edit-modal-close">&times;</button>
                    </header>

                    <div class="c-world-modal__content m-party-edit">
                        <div class="c-form__group">
                            <label for="js-input-party-name" class="c-form__label">パーティ名</label>
                            <input type="text" id="js-input-party-name" class="c-form__input"
                                placeholder="例：メインパーティー / 組みたいパーティー">
                        </div>

                        <div class="p-portal-party__edit-zone">
                            <label class="c-form__label">編成メンバー</label>
                            <div class="p-portal-party__slots js-party-modal-slots">
                                <!-- スロット1 -->
                                <div class="p-portal-party__slot-col"
                                    style="display: flex; flex-direction: column; gap: 4px; align-items: center;">
                                    <button type="button" class="p-portal-party__slot js-open-character-picker"
                                        data-target-input="js-portal-modal-chara-1"
                                        data-target-preview="js-portal-modal-img-1">
                                        <img id="js-portal-modal-img-1" src="" class="is-hidden" alt="枠1">
                                        <span class="p-portal-party__plus-mark">+</span>
                                        <input type="hidden" id="js-portal-modal-chara-1" value="">
                                    </button>
                                    <select id="js-portal-modal-rarity-1"
                                        class="p-portal-select__input js-portal-modal-rarity">
                                    </select>
                                </div>

                                <!-- スロット2 -->
                                <div class="p-portal-party__slot-col"
                                    style="display: flex; flex-direction: column; gap: 4px; align-items: center;">
                                    <button type="button" class="p-portal-party__slot js-open-character-picker"
                                        data-target-input="js-portal-modal-chara-2"
                                        data-target-preview="js-portal-modal-img-2">
                                        <img id="js-portal-modal-img-2" src="" class="is-hidden" alt="枠2">
                                        <span class="p-portal-party__plus-mark">+</span>
                                        <input type="hidden" id="js-portal-modal-chara-2" value="">
                                    </button>
                                    <select id="js-portal-modal-rarity-2"
                                        class="p-portal-select__input js-portal-modal-rarity">
                                        <option value="SR">SR</option>
                                        <option value="SR+">SR+</option>
                                        <option value="SSR">SSR</option>
                                        <option value="SSR+">SSR+</option>
                                        <option value="UR">UR</option>
                                        <option value="UR+">UR+</option>
                                        <option value="LR" selected>LR</option>
                                        <option value="LR_1">LR1</option>
                                        <option value="LR_2">LR2</option>
                                        <option value="LR_3">LR3</option>
                                        <option value="LR_4">LR4</option>
                                        <option value="LR_5">LR5</option>
                                        <option value="LR_6">LR6</option>
                                        <option value="LR_7">LR7</option>
                                        <option value="LR_8">LR8</option>
                                        <option value="LR_9">LR9</option>
                                        <option value="LR_10">LR10</option>
                                    </select>
                                </div>

                                <!-- スロット3 -->
                                <div class="p-portal-party__slot-col"
                                    style="display: flex; flex-direction: column; gap: 4px; align-items: center;">
                                    <button type="button" class="p-portal-party__slot js-open-character-picker"
                                        data-target-input="js-portal-modal-chara-3"
                                        data-target-preview="js-portal-modal-img-3">
                                        <img id="js-portal-modal-img-3" src="" class="is-hidden" alt="枠3">
                                        <span class="p-portal-party__plus-mark">+</span>
                                        <input type="hidden" id="js-portal-modal-chara-3" value="">
                                    </button>
                                    <select id="js-portal-modal-rarity-3"
                                        class="p-portal-select__input js-portal-modal-rarity">
                                        <option value="SR">SR</option>
                                        <option value="SR+">SR+</option>
                                        <option value="SSR">SSR</option>
                                        <option value="SSR+">SSR+</option>
                                        <option value="UR">UR</option>
                                        <option value="UR+">UR+</option>
                                        <option value="LR" selected>LR</option>
                                        <option value="LR_1">LR1</option>
                                        <option value="LR_2">LR2</option>
                                        <option value="LR_3">LR3</option>
                                        <option value="LR_4">LR4</option>
                                        <option value="LR_5">LR5</option>
                                        <option value="LR_6">LR6</option>
                                        <option value="LR_7">LR7</option>
                                        <option value="LR_8">LR8</option>
                                        <option value="LR_9">LR9</option>
                                        <option value="LR_10">LR10</option>
                                    </select>
                                </div>

                                <!-- スロット4 -->
                                <div class="p-portal-party__slot-col"
                                    style="display: flex; flex-direction: column; gap: 4px; align-items: center;">
                                    <button type="button" class="p-portal-party__slot js-open-character-picker"
                                        data-target-input="js-portal-modal-chara-4"
                                        data-target-preview="js-portal-modal-img-4">
                                        <img id="js-portal-modal-img-4" src="" class="is-hidden" alt="枠4">
                                        <span class="p-portal-party__plus-mark">+</span>
                                        <input type="hidden" id="js-portal-modal-chara-4" value="">
                                    </button>
                                    <select id="js-portal-modal-rarity-4"
                                        class="p-portal-select__input js-portal-modal-rarity">
                                        <option value="SR">SR</option>
                                        <option value="SR+">SR+</option>
                                        <option value="SSR">SSR</option>
                                        <option value="SSR+">SSR+</option>
                                        <option value="UR">UR</option>
                                        <option value="UR+">UR+</option>
                                        <option value="LR" selected>LR</option>
                                        <option value="LR_1">LR1</option>
                                        <option value="LR_2">LR2</option>
                                        <option value="LR_3">LR3</option>
                                        <option value="LR_4">LR4</option>
                                        <option value="LR_5">LR5</option>
                                        <option value="LR_6">LR6</option>
                                        <option value="LR_7">LR7</option>
                                        <option value="LR_8">LR8</option>
                                        <option value="LR_9">LR9</option>
                                        <option value="LR_10">LR10</option>
                                    </select>
                                </div>

                                <!-- スロット5 -->
                                <div class="p-portal-party__slot-col"
                                    style="display: flex; flex-direction: column; gap: 4px; align-items: center;">
                                    <button type="button" class="p-portal-party__slot js-open-character-picker"
                                        data-target-input="js-portal-modal-chara-5"
                                        data-target-preview="js-portal-modal-img-5">
                                        <img id="js-portal-modal-img-5" src="" class="is-hidden" alt="枠5">
                                        <span class="p-portal-party__plus-mark">+</span>
                                        <input type="hidden" id="js-portal-modal-chara-5" value="">
                                    </button>
                                    <select id="js-portal-modal-rarity-5"
                                        class="p-portal-select__input js-portal-modal-rarity">
                                        <option value="SR">SR</option>
                                        <option value="SR+">SR+</option>
                                        <option value="SSR">SSR</option>
                                        <option value="SSR+">SSR+</option>
                                        <option value="UR">UR</option>
                                        <option value="UR+">UR+</option>
                                        <option value="LR" selected>LR</option>
                                        <option value="LR_1">LR1</option>
                                        <option value="LR_2">LR2</option>
                                        <option value="LR_3">LR3</option>
                                        <option value="LR_4">LR4</option>
                                        <option value="LR_5">LR5</option>
                                        <option value="LR_6">LR6</option>
                                        <option value="LR_7">LR7</option>
                                        <option value="LR_8">LR8</option>
                                        <option value="LR_9">LR9</option>
                                        <option value="LR_10">LR10</option>
                                    </select>
                                </div>
                            </div>
                            <p class="c-world-form__help u-mt-8">※ドラッグ＆ドロップして並び替え出来ます。</p>
                        </div>

                        <div class="p-portal-party__modal-actions">
                            <button type="button" id="js-portal-btn-delete-party" class="c-btn m-delete-action">
                                <i class="fa-solid fa-trash-can"></i> パーティ削除
                            </button>
                            <button type="button" id="js-portal-btn-save-party" class="c-btn m-save-action">
                                <i class="fa-solid fa-check"></i> 反映する
                            </button>
                        </div>
                    </div>
                </div>
            </div>


        </main>
        <div class="l-sidebar"></div>


        <!-- 🔮 共通キャラクターピッカーがJSで自動生成されてここに挿入されます -->
        <div id="js-character-picker-container"></div>

        <!-- 外部から読み込むフッターの受け皿 -->
        <footer id="js-footer-container" class="l-footer js-footer-container"></footer>

    </div>
</body>

</html>
