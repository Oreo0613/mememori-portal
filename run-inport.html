        async function startImport() {
            console.log("🚀 インポート処理を開始します...");
            let successCount = 0;

            // ⭕️ 修正：[0] をつけることで、外側の余分なカッコを確実に1枚剥ぎ取ります！
            const targetList = sheetData;

            for (const char of targetList) {
                if (!char.id) continue;

                // 💡 Firebaseのルール（②キャラクターマスタ）に合わせて登録します
                const docRef = doc(db, "character_master", String(char.id));

                try {
                    await setDoc(docRef, char);
                    console.log(`✅ ID: ${char.id} (${char.name}) のインポート成功`);
                    successCount++;
                } catch (error) {
                    console.error(`❌ ID: ${char.id} のインポート失敗:`, error);
                }
            }

            console.log(`✨ すべての処理が完了しました！ 成功件数: ${successCount} / ${targetList.length}`);
            alert(`✨ インポートが完了しました！\n成功件数: ${successCount} 件`);
        }


        // ページが開かれたら自動実行
        startImport();
