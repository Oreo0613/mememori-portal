<!-- assets/includes/world-selector.html -->
<div class="c-world-selector">

    <!-- 🟢 トリガー：左上のキャラアイコン型ボタン -->
    <button type="button" id="js-world-modal-open" class="c-world-selector__btn" aria-label="ワールド選択を開く">
        <div class="c-world-selector__icon-wrap">
            <i class="fa-solid fa-user-astronaut"></i>
        </div>
        <div class="c-world-selector__info">
            <span id="js-current-world-number" class="c-world-selector__world">未登録</span>
            <span id="js-current-world-name" class="c-world-selector__name"></span>
        </div>
    </button>

    <!-- ===================================
       📥 【モーダル1】ワールド選択モーダル
       ================================== -->
    <div id="js-world-modal" class="c-modal c-world-modal" aria-hidden="true">
        <div id="js-world-modal-overlay" class="c-modal__overlay c-world-modal__overlay"></div>

        <div class="c-modal__container c-world-modal__container">
            <header class="c-world-modal__header">
                <!-- 💡 【ブラッシュアップ】ステータスエリア全体をボタン化し、js-account-trigger を付与！ -->
                <button type="button" class="c-world-modal__status js-account-trigger" title="アカウント設定を開く">
                    <div class="c-world-modal__icon-wrap">
                        <i class="fa-solid fa-user-astronaut"></i>
                    </div>
                    <div class="c-world-modal__info">
                        <!-- 上段：アカウント名 -->
                        <span id="js-modal-user-text" class="c-world-modal__name">ゲスト ユーザー</span>
                        <!-- 下段：全ワールド共通の固有ID -->
                        <span id="js-modal-uid-text" class="c-world-modal__uid">ID: 未ログイン</span>
                    </div>
                </button>

                <!-- 右側の操作ボタンたち（ログアウトと閉じる） -->
                <div class="c-world-modal__header-controls">
                    <button type="button" id="js-btn-logout" class="c-world-modal__logout-btn" title="アカウントからログアウト">
                        <i class="fa-solid fa-right-from-bracket"></i>ログアウト
                    </button>
                    <button type="button" id="js-world-modal-close"
                        class="c-modal__close-btn c-world-modal__close-btn">&times;</button>
                </div>
            </header>

            <div class="c-world-modal__content">
                <ul class="c-world-modal__list js-world-list"></ul>
            </div>

            <div class="c-world-modal__add-btn-area">
                <div class="c-btn c-world-modal__add-btn js-create-world">
                    <i class="fa-solid fa-plus"></i>ワールドを新規追加
                </div>
            </div>
        </div>
    </div>

    <!-- =================================
       📥 【モーダル2】 ワールド追加モーダル
       =================================== -->

    <div id="js-create-modal" class="c-modal c-create-modal" aria-hidden="true">
        <div id="js-create-modal-overlay" class="c-modal__overlay c-create-modal__overlay"></div>

        <div class="c-modal__container c-create-modal__container">
            <header class="c-create-modal__header">
                <h3 class="c-create-modal__title">ワールドの新規登録</h3>
                <button type="button" id="js-create-world-close"
                    class="c-modal__close-btn c-create-modal__close-btn">&times;</button>
            </header>
            <div class="c-create-modal__content">
                <form id="js-create-world-form" class="c-form">

                    <!-- ① ワールド番号（必須入力フィールド） -->
                    <div class="c-form__group">
                        <label for="js-input-world-number" class="c-form__label">
                            ワールド番号 <span class="c-form__required">必須</span>
                        </label>
                        <input type="number" id="js-input-world-number" class="c-form__input" placeholder="例: 178"
                            required min="1">
                    </div>

                    <!-- ② ワールド名（任意入力フィールド） -->
                    <div class="c-form__group">
                        <label for="js-input-world-name" class="c-form__label">ワールド名</label>
                        <input type="text" id="js-input-world-name" class="c-form__input" placeholder="例: 新プレイヤー">
                    </div>

                    <!-- ③ 決定アクションボタン領域 -->
                    <div class="c-form__action-area">
                        <button type="submit" id="js-create-world-submit" class="c-btn c-form__submit-btn">
                            <i class="fa-solid fa-check"></i>この内容で登録する
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ====================================
     👤 【モーダル3】アカウント情報編集モーダル
     =======================================-->
    <div id="js-account-modal" class="c-modal c-account-modal--account" aria-hidden="true" inert>
        <div id="js-account-modal-overlay" class="c-modal__overlay c-account-modal__overlay"></div>
        <div class="c-modal__container c-account-modal__container">

            <header class="c-account-modal__header">
                <div class="c-account-modal__title-wrap">
                    <i class="fa-solid fa-gear"></i>
                    <h2 class="c-account-modal__title">アカウント設定</h2>
                </div>
                <!-- × 閉じるボタン -->
                <button type="button" id="js-account-modal-close" class="c-account-modal__close-btn">&times;</button>
            </header>

            <div class="c-account-modal__content">
                <!-- フォーム：アカウント名の変更 -->
                <form id="js-account-name-form" class="c-world-form">
                    <div class="c-world-form__item">
                        <label for="js-input-account-name" class="c-world-form__label">アカウント名</label>
                        <p class="c-world-form__help">アプリ内で表示される名前です。いつでも自由に変更できます。</p>
                        <input type="text" id="js-input-account-name" class="c-world-form__input" placeholder="例：名無しの魔女"
                            maxlength="15" required>
                    </div>

                    <button type="submit" class="c-world-form__submit-btn">
                        <i class="fa-solid fa-floppy-disk"></i> アカウント名を保存する
                    </button>
                </form>

                <!-- システム情報（UIDの確認エリア） -->
                <div class="c-account-modal__system-info">
                    <span class="c-account-modal__system-label">あなたのアカウントID（UID）</span>
                    <p id="js-account-full-uid" class="c-account-modal__system-value">未ログイン</p>
                    <p class="c-account-modal__system-help">※このIDはFirebaseが発行した共通の識別番号です。</p>
                </div>
            </div>

        </div>
    </div>


</div>
