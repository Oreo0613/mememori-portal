<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャラクターピッカー</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>

<body>

    <!-- 🔲 共通部品：キャラクターピッカーモーダル -->
    <div id="js-character-modal" class="c-modal c-world-modal" aria-hidden="true" inert>
        <div class="c-modal__overlay js-character-modal-close"></div>
        <div class="c-world-modal__container c-modal__container">
            <header class="c-world-modal__header">
                <div class="c-account-modal__title-wrap">
                    <i class="fa-solid fa-user-gear"></i>
                    <span class="c-account-modal__title">キャラクター選択</span>
                </div>
                <button type="button" class="c-world-modal__close-btn js-character-modal-close">&times;</button>
            </header>

            <div class="c-world-modal__content">
                <!-- 🏷️ 属性の絞り込みフィルターエリア（管理画面からそのまま移植） -->
                <div class="c-world-modal__filter-flex">
                    <button type="button" class="c-world-modal__filter-btn is-active js-attr-filter" data-attr="all">
                        <img class="c-world-modal__filter-img" src="../../assets/images/filter-icon/icon-all.png" alt="ALL">
                    </button>
                    <button type="button" class="c-world-modal__filter-btn js-attr-filter" data-attr="藍">
                        <img class="c-world-modal__filter-img" src="../../assets/images/filter-icon/icon-attr-blue.png"
                            alt="藍">
                    </button>
                    <button type="button" class="c-world-modal__filter-btn js-attr-filter" data-attr="紅">
                        <img class="c-world-modal__filter-img" src="../../assets/images/filter-icon/icon-attr-red.png"
                            alt="紅">
                    </button>
                    <button type="button" class="c-world-modal__filter-btn js-attr-filter" data-attr="翠">
                        <img class="c-world-modal__filter-img" src="../../assets/images/filter-icon/icon-attr-green.png"
                            alt="翠">
                    </button>
                    <button type="button" class="c-world-modal__filter-btn js-attr-filter" data-attr="黄">
                        <img class="c-world-modal__filter-img" src="../../assets/images/filter-icon/icon-attr-yellow.png"
                            alt="黄">
                    </button>
                    <button type="button" class="c-world-modal__filter-btn js-attr-filter" data-attr="天">
                        <img class="c-world-modal__filter-img" src="../../assets/images/filter-icon/icon-attr-holy.png"
                            alt="天">
                    </button>
                    <button type="button" class="c-world-modal__filter-btn js-attr-filter" data-attr="冥">
                        <img class="c-world-modal__filter-img" src="../../assets/images/filter-icon/icon-attr-dark.png"
                            alt="冥">
                    </button>
                </div>

                <!-- 👥 キャラクターアイコンが並ぶグリッド領域 -->
                <div id="js-character-select-list"></div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================================================
        // 🔮 【完全部品共通化】キャラクターピッカーHTML非同期ロード ＆ 動的ターゲット連動
        // ==========================================================================

        /**
         * 💡 1. キャラクターピッカーのHTMLファイルをサーバーからロードして流し込む
         */
        async function insertCharacterPicker() {
            const container = document.getElementById("js-character-picker-container");
            if (!container) return;
            try {
                const response = await fetch("assets/includes/character-picker.html");
                if (!response.ok) throw new Error("キャラクターピッカーの読み込みに失敗しました");
                container.innerHTML = await response.text();

                // HTML挿入が100%完了した後に、イベントハンドラを確実にバインドする
                initCharacterSelectorModal();
            } catch (error) {
                console.error("🚨 キャラクターピッカーの読み込みエラー:", error);
            }
        }

        /**
         * 💡 2. 呼び出し元のデータ属性から格納先を動的に判別し、1つのピッカーで共存させる
         */
        function initCharacterSelectorModal() {
            const modalChara = document.getElementById("js-character-modal");
            const closeCharaBtns = document.querySelectorAll(".js-character-modal-close");
            const gridContainer = document.getElementById("js-character-select-list");
            const filterBtns = document.querySelectorAll(".js-attr-filter");

            if (!modalChara || !gridContainer) return;

            // どのインプット（格納先）とプレビューが選ばれているかを記憶する、ピッカー内部のスコープ変数
            let activeInputTargetId = "";
            let activePreviewTargetId = "";

            // 🔓 アプリ内すべての「js-open-character-picker」クラスを持つ要素のクリックを検知
            document.addEventListener("click", (e) => {
                const triggerBtn = e.target.closest(".js-open-character-picker");
                if (!triggerBtn) return;

                // トリガーボタンに書き込まれている「ターゲットID」をその場で記憶！
                activeInputTargetId = triggerBtn.dataset.targetInput;
                activePreviewTargetId = triggerBtn.dataset.targetPreview;

                // 属性フィルターの選択表示を「ALL」にリセット
                filterBtns.forEach(btn => btn.classList.remove("is-active"));
                const allBtn = Array.from(filterBtns).find(btn => btn.dataset.attr === "all");
                if (allBtn) allBtn.classList.add("is-active");

                // リストの初期描画
                renderFilteredCharacters("all");

                modalChara.classList.add("is-open");
                modalChara.removeAttribute("aria-hidden");
                modalChara.removeAttribute("inert");
            });

            // モーダルをクローズ
            const closeCharaModal = () => {
                modalChara.classList.remove("is-open");
                modalChara.setAttribute("aria-hidden", "true");
                modalChara.setAttribute("inert", "");
            };

            closeCharaBtns.forEach(btn => btn.addEventListener("click", closeCharaModal));

            // 属性タブによるフィルタリング（ onclick の排除 ）
            filterBtns.forEach(btn => {
                btn.addEventListener("click", () => {
                    filterBtns.forEach(b => b.classList.remove("is-active"));
                    btn.classList.add("is-active");
                    renderFilteredCharacters(btn.dataset.attr);
                });
            });

            // フィルター条件に基づく魔女カードの動的展開
            function renderFilteredCharacters(attrFilter) {
                gridContainer.innerHTML = "";

                if (!Array.isArray(characterMaster) || characterMaster.length === 0) {
                    gridContainer.innerHTML = '<li class="c-world-modal__item--empty">データがありません</li>';
                    return;
                }

                // 現在記憶しているアクティブなインプットから現在の値を回収して is-selected の付与を同期
                const currentSelectedId = activeInputTargetId ? document.getElementById(activeInputTargetId)?.value : "";

                characterMaster.forEach((chara) => {
                    // 管理画面の flt() と全く同じフィルタリング判定
                    if (attrFilter !== "all" && String(chara.attr).trim() !== attrFilter) return;

                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "c-world-modal__card";
                    if (String(chara.id) === String(currentSelectedId)) {
                        button.classList.add("is-selected");
                    }

                    const img = document.createElement("img");
                    img.src = chara.iconUrl || "assets/images/chara-icon/1.webp";
                    img.alt = chara.name || "";

                    button.appendChild(img);

                    // 🌍 アイコン決定・値の書き込みコミット処理
                    button.addEventListener("click", () => {
                        // ① ボタンから回収していた特定のIDを持つインプットにキャラクターIDを書き込む
                        if (activeInputTargetId) {
                            const targetInput = document.getElementById(activeInputTargetId);
                            if (targetInput) targetInput.value = chara.id;
                        }

                        // ② ボタンから回収していた特定のIDを持つ画像タグの src を上書きし、非表示クラスを剥がす
                        if (activePreviewTargetId) {
                            const targetPreview = document.getElementById(activePreviewTargetId);
                            if (targetPreview) {
                                targetPreview.src = chara.iconUrl || "assets/images/chara-icon/1.webp";
                                targetPreview.classList.remove("is-hidden"); // CSSによる表示制御
                            }
                        }

                        closeCharaModal();
                    });

                    gridContainer.appendChild(button);
                });
            }
        }

    </script>
</body>

</html>
