
    <!-- 🔲 共通部品：キャラクターピッカーモーダル -->
    <div id="js-character-modal" class="c-modal c-world-modal" aria-hidden="true" inert>
        <div class="c-modal__overlay js-character-modal-close"></div>
        <div class="c-world-modal__container c-modal__container">
            <header class="c-world-modal__header">
                <div class="c-account-modal__title-wrap">
                    <i class="fa-solid fa-user-gear"></i>
                    <span class="c-account-modal__title">キャラクター選択</span>
                </div>
                <button type="button" class="c-world-modal__close-btn js-character-modal-close">&times;</button>
            </header>

            <div class="c-world-modal__content">
                <!-- 🏷️ 属性の絞り込みフィルターエリア（管理画面からそのまま移植） -->
                <div class="c-world-modal__filter-flex">
                    <button type="button" class="c-world-modal__filter-btn is-active js-attr-filter" data-attr="all">
                        <img class="c-world-modal__filter-img" src="../../assets/images/filter-icon/icon-all.png" alt="ALL">
                    </button>
                    <button type="button" class="c-world-modal__filter-btn js-attr-filter" data-attr="藍">
                        <img class="c-world-modal__filter-img" src="../../assets/images/filter-icon/icon-attr-blue.png"
                            alt="藍">
                    </button>
                    <button type="button" class="c-world-modal__filter-btn js-attr-filter" data-attr="紅">
                        <img class="c-world-modal__filter-img" src="../../assets/images/filter-icon/icon-attr-red.png"
                            alt="紅">
                    </button>
                    <button type="button" class="c-world-modal__filter-btn js-attr-filter" data-attr="翠">
                        <img class="c-world-modal__filter-img" src="../../assets/images/filter-icon/icon-attr-green.png"
                            alt="翠">
                    </button>
                    <button type="button" class="c-world-modal__filter-btn js-attr-filter" data-attr="黄">
                        <img class="c-world-modal__filter-img" src="../../assets/images/filter-icon/icon-attr-yellow.png"
                            alt="黄">
                    </button>
                    <button type="button" class="c-world-modal__filter-btn js-attr-filter" data-attr="天">
                        <img class="c-world-modal__filter-img" src="../../assets/images/filter-icon/icon-attr-holy.png"
                            alt="天">
                    </button>
                    <button type="button" class="c-world-modal__filter-btn js-attr-filter" data-attr="冥">
                        <img class="c-world-modal__filter-img" src="../../assets/images/filter-icon/icon-attr-dark.png"
                            alt="冥">
                    </button>
                </div>

                <!-- 👥 キャラクターアイコンが並ぶグリッド領域 -->
                <div id="js-character-select-list"></div>
            </div>
        </div>
    </div>
