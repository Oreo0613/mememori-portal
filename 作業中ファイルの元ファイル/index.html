<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ユーザーポータルテスト</title>

    <!-- リセットCSS & Googleフォントやアイコンなど -->
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/destyle.css@4.0.0/destyle.min.css" />
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/portal.css">
    <script src="https://kit.fontawesome.com/d36bec305b.js" crossorigin="anonymous"></script>

    <script src="assets/js/main.js" type="module"></script>
</head>

<body>

    <main class="c-portal ">

        <!-- 📦 メインコンテナ：PCでは横並び、スマホでは縦並びにCSSで可変 -->
        <div class="c-portal-main">
            <div class="c-portal__mask">
            </div>
            <div class="c-portal__header">
                <div id="js-world-selector-container" class="c-main__header js-header-container"></div>
            </div>
            <div class="c-portal__content">
                <div class="c-portal-wrapper">

                    <!-- 👈 左側：進捗数値入力・四属性の塔・活動メモエリア -->
                    <div class="c-portal-main__left">

                        <!-- クエスト（章-ステージ分割） ＆ メインの塔進捗入力 -->
                        <div class="c-portal-progress">
                            <div class="c-portal-progress__box m-quest-box">
                                <span class="c-portal-progress__label">クエスト</span>
                                <div class="c-portal-quest-input-group">
                                    <input type="number" id="js-portal-quest-chapter" class="c-portal-input m-center"
                                        placeholder="0" min="1">
                                    <span class="c-portal-quest-separator">-</span>
                                    <input type="number" id="js-portal-quest-stage" class="c-portal-input m-center"
                                        placeholder="0" min="1">
                                </div>
                            </div>
                            <div class="c-portal-progress__box">
                                <span class="c-portal-progress__label">無窮の塔</span>
                                <input type="number" id="js-portal-muguu" class="c-portal-input m-center"
                                    placeholder="0" min="0">
                            </div>
                        </div>

                        <!-- 四属性の塔（藍・紅・翠·黄）数値入力 -->
                        <div class="c-portal-towers">
                            <div class="c-portal-towers__box m-blue">
                                <span class="c-portal-towers__label">藍の塔</span>
                                <input type="number" id="js-portal-tower-blue" class="c-portal-tower-input"
                                    placeholder="0" min="0">
                            </div>
                            <div class="c-portal-towers__box m-red">
                                <span class="c-portal-towers__label">紅の塔</span>
                                <input type="number" id="js-portal-tower-red" class="c-portal-tower-input"
                                    placeholder="0" min="0">
                            </div>
                            <div class="c-portal-towers__box m-green">
                                <span class="c-portal-towers__label">翠の塔</span>
                                <input type="number" id="js-portal-tower-green" class="c-portal-tower-input"
                                    placeholder="0" min="0">
                            </div>
                            <div class="c-portal-towers__box m-yellow">
                                <span class="c-portal-towers__label">黄の塔</span>
                                <input type="number" id="js-portal-tower-yellow" class="c-portal-tower-input"
                                    placeholder="0" min="0">
                            </div>
                        </div>

                        <!-- ワールドの概要備考メモ・活動コメント -->
                        <div class="c-portal-memo">
                            <h4 class="c-portal-memo__title">ワールド活動メモ</h4>
                            <textarea id="js-portal-world-memo" class="c-portal-textarea" placeholder="自由に記述できます"
                                rows="3"></textarea>
                        </div>

                    </div>

                    <!-- 👉 右側：パーティ編成エリア -->
                    <div class="c-portal-main__right">
                        <div class="c-portal-party-container">
                            <header class="c-portal-party-container__header">
                                <h4 class="c-portal-party-container__title">
                                    <i class="fa-solid fa-shield-halved"></i> パーティー編成
                                </h4>
                                <button type="button" id="js-portal-btn-add-party"
                                    class="c-btn c-portal-party-container__add-btn">
                                    <i class="fa-solid fa-plus"></i> 追加
                                </button>
                            </header>

                            <!-- 👥 ここに登録されたパーティリストが動的にJavaScriptでレンダリングされます -->
                            <div id="js-portal-party-list" class="c-portal-party-list"></div>
                        </div>
                    </div>


                </div>
                <!-- ⚙️ 詳細設定エリア（開閉アコーディオン仕様） -->
                <div class="c-portal-settings-accordion">
                    <button type="button" id="js-portal-settings-toggle" class="c-portal-settings-toggle">
                        <i class="fa-solid fa-gear"></i> ワールドの詳細設定を編集
                    </button>

                    <div id="js-portal-settings-content" class="c-portal-settings-content">
                        <div class="c-portal-settings-grid">
                            <div class="c-portal-settings-field">
                                <label class="c-portal-settings-label">ワールドのアイコン</label>

                                <button type="button" id="js-portal-character-trigger"
                                    class="c-portal-chara-btn js-open-character-picker"
                                    data-target-input="js-portal-setting-character-id"
                                    data-target-preview="js-portal-setting-icon-preview">
                                    <img id="js-portal-setting-icon-preview" src="assets/images/chara-icon/1.webp"
                                        alt="キャラクターアイコン">
                                </button>


                                <input type="hidden" id="js-portal-setting-character-id" value="">
                            </div>
                            <div class="c-portal-settings-field">
                                <label class="c-portal-settings-label">ワールド名</label>
                                <input type="text" id="js-portal-setting-name" class="c-portal-input"
                                    placeholder="例：新プレイヤー">
                            </div>
                            <div class="c-portal-settings-field">
                                <label class="c-portal-settings-label">開始日</label>
                                <input type="date" id="js-portal-setting-start-date" class="c-portal-input">
                            </div>
                            <div class="c-portal-settings-field">
                                <label class="c-portal-settings-label">外部リンクURL</label>
                                <input type="url" id="js-portal-setting-link" class="c-portal-input"
                                    placeholder="https://notion.so...">
                            </div>
                            <div class="c-portal-settings-field">
                                <label class="c-portal-settings-label">ワールドのステータス</label>
                                <div class="c-portal-select">
                                    <select id="js-portal-setting-status" class="c-portal-select__input">
                                        <option value="active" selected>有効</option>
                                        <option value="archived">無効（アーカイブ）</option>
                                    </select>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
                <!-- 🗓️ 日付・各種アクションフッター -->
                <div class="c-portal-footer">
                    <span id="js-portal-world-updated">最終更新: ──</span>
                    <div class="c-portal-actions">
                        <a id="js-portal-external-link" href="https://notion.com"
                            class="c-portal-footer__external-link-btn" target="_blank">
                            <img src="http://google.com"> 外部リンク
                        </a>

                    </div>
                </div>
            </div>
        </div>
        <div class="c-floating-container">
            <div class="c-floating-inner">
                <button type="button" id="js-portal-btn-update" class="c-btn c-portal-footer__update-btn">
                    <i class="fa-solid fa-rotate"></i> 更新する
                </button>
            </div>
        </div>

        <!-- 🔲 共通部品：パーティ編集用モーダル -->
        <div id="js-party-edit-modal" class="c-modal c-party-edit-modal c-world-modal" aria-hidden="true" inert>
            <div class="c-modal__overlay js-party-edit-modal-close"></div>
            <div class="c-world-modal__container c-modal__container">
                <header class="c-world-modal__header">
                    <div class="c-account-modal__title-wrap">
                        <i class="fa-solid fa-pen-to-square"></i>
                        <span class="c-account-modal__title">パーティ編成の編集</span>
                    </div>
                    <button type="button" class="c-world-modal__close-btn js-party-edit-modal-close">&times;</button>
                </header>

                <div class="c-world-modal__content m-party-edit">
                    <!-- 🏷️ パーティ名入力フォーム -->
                    <div class="c-form__group">
                        <label for="js-input-party-name" class="c-form__label">パーティ名</label>
                        <input type="text" id="js-input-party-name" class="c-form__input"
                            placeholder="例：メインパーティー / 組みたいパーティー">
                    </div>

                    <!-- 👥 キャラクター枠（旧 index.html の5枠構成を移植） -->
                    <div class="c-portal-party__edit-zone">
                        <label class="c-form__label">編成メンバー</label>
                        <div class="c-portal-party__slots js-party-modal-slots">
                            <!-- 枠1〜5 (JSで動的にターゲットID付きで再配置しても良いですが、構造は固定) -->
                            <button type="button" class="c-portal-party__slot js-open-character-picker"
                                data-target-input="js-portal-modal-chara-1" data-target-preview="js-portal-modal-img-1">
                                <img id="js-portal-modal-img-1" src="" class="is-hidden" alt="枠1">
                                <span>+</span>
                                <input type="hidden" id="js-portal-modal-chara-1" value="">
                            </button>
                            <button type="button" class="c-portal-party__slot js-open-character-picker"
                                data-target-input="js-portal-modal-chara-2" data-target-preview="js-portal-modal-img-2">
                                <img id="js-portal-modal-img-2" src="" class="is-hidden" alt="枠2">
                                <span>+</span>
                                <input type="hidden" id="js-portal-modal-chara-2" value="">
                            </button>
                            <button type="button" class="c-portal-party__slot js-open-character-picker"
                                data-target-input="js-portal-modal-chara-3" data-target-preview="js-portal-modal-img-3">
                                <img id="js-portal-modal-img-3" src="" class="is-hidden" alt="枠3">
                                <span>+</span>
                                <input type="hidden" id="js-portal-modal-chara-3" value="">
                            </button>
                            <button type="button" class="c-portal-party__slot js-open-character-picker"
                                data-target-input="js-portal-modal-chara-4" data-target-preview="js-portal-modal-img-4">
                                <img id="js-portal-modal-img-4" src="" class="is-hidden" alt="枠4">
                                <span>+</span>
                                <input type="hidden" id="js-portal-modal-chara-4" value="">
                            </button>
                            <button type="button" class="c-portal-party__slot js-open-character-picker"
                                data-target-input="js-portal-modal-chara-5" data-target-preview="js-portal-modal-img-5">
                                <img id="js-portal-modal-img-5" src="" class="is-hidden" alt="枠5">
                                <span>+</span>
                                <input type="hidden" id="js-portal-modal-chara-5" value="">
                            </button>
                        </div>
                        <p class="c-world-form__help u-mt-8">※ドラッグ＆ドロップして並び替え出来ます。</p>
                    </div>

                    <!-- ⚠️ アクションボタンエリア -->
                    <div class="c-portal-party__modal-actions">
                        <button type="button" id="js-portal-btn-delete-party" class="c-btn m-delete-action">
                            <i class="fa-solid fa-trash-can"></i> パーティ削除
                        </button>
                        <button type="button" id="js-portal-btn-save-party" class="c-btn m-save-action">
                            <i class="fa-solid fa-check"></i> 反映する
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- 🔮 共通キャラクターピッカーがJSで自動生成されてここに挿入されます -->
    <div id="js-character-picker-container"></div>


    <!-- 外部から読み込むフッターの受け皿 -->
    <footer id="js-footer-container" class="c-footer js-footer-container">


    </footer>

</body>

</html>
