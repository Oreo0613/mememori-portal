<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>キャラクターページ</title>

    <!-- リセットCSS & Googleフォントやアイコンなど -->
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/destyle.css@4.0.0/destyle.min.css" />
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/character.css">
    <script src="https://kit.fontawesome.com/d36bec305b.js" crossorigin="anonymous"></script>

    <script src="assets/js/main.js" type="module"></script>
    <script src="assets/js/character.js"></script>
</head>

<body>

    <main class="c-portal ">
        <div class="c-portal-main">
            <div class="c-portal__mask">
            </div>
            <div class="c-portal__header">
                <div id="js-world-selector-container" class="c-main__header c-floating-header js-header-container">
                </div>
            </div>

            <div class="c-portal__content">
                <!-- =========================================================================
                 🌐 ワールド×キャラクター タブコンテンツ（一般ユーザー用）
                 ========================================================================= -->
                <div class="user-tab-content js-tab-content-character" id="tabCharacter">

                    <!-- 🔍 BEMクリーンアップ仕様：フィルターセクション -->
                    <div class="c-filter">

                        <!-- 属性選択ブロック -->
                        <div class="c-filter__row">
                            <div class="c-filter__label">属性</div>
                            <div class="c-filter__flex">
                                <button type="button" class="c-filter__btn is-active js-filter-attr" data-attr="ALL">
                                    <img class="c-filter__img" src="assets/images/filter-icon/icon-all.png" alt="全部">
                                </button>
                                <button type="button" class="c-filter__btn js-filter-attr" data-attr="藍">
                                    <img class="c-filter__img" src="assets/images/filter-icon/icon-attr-blue.png"
                                        alt="藍">
                                </button>
                                <button type="button" class="c-filter__btn js-filter-attr" data-attr="紅">
                                    <img class="c-filter__img" src="assets/images/filter-icon/icon-attr-red.png"
                                        alt="紅">
                                </button>
                                <button type="button" class="c-filter__btn js-filter-attr" data-attr="翠">
                                    <img class="c-filter__img" src="assets/images/filter-icon/icon-attr-green.png"
                                        alt="翠">
                                </button>
                                <button type="button" class="c-filter__btn js-filter-attr" data-attr="黄">
                                    <img class="c-filter__img" src="assets/images/filter-icon/icon-attr-yellow.png"
                                        alt="黄">
                                </button>
                                <button type="button" class="c-filter__btn js-filter-attr" data-attr="天">
                                    <img class="c-filter__img" src="assets/images/filter-icon/icon-attr-holy.png"
                                        alt="天">
                                </button>
                                <button type="button" class="c-filter__btn js-filter-attr" data-attr="冥">
                                    <img class="c-filter__img" src="assets/images/filter-icon/icon-attr-dark.png"
                                        alt="冥">
                                </button>
                            </div>
                        </div>

                        <!-- タイプ選択ブロック -->
                        <div class="c-filter__row">
                            <div class="c-filter__label">タイプ</div>
                            <div class="c-filter__flex">
                                <button type="button" class="c-filter__btn is-active js-filter-type" data-type="ALL">
                                    <img class="c-filter__img" src="assets/images/filter-icon/icon-all.png" alt="全部">
                                </button>
                                <button type="button" class="c-filter__btn js-filter-type" data-type="ウォーリアー">
                                    <img class="c-filter__img" src="assets/images/filter-icon/icon-type-warrior.png"
                                        alt="ウォーリアー">
                                </button>
                                <button type="button" class="c-filter__btn js-filter-type" data-type="スナイパー">
                                    <img class="c-filter__img" src="assets/images/filter-icon/icon-type-sniper.png"
                                        alt="スナイパー">
                                </button>
                                <button type="button" class="c-filter__btn js-filter-type" data-type="ソーサラー">
                                    <img class="c-filter__img" src="assets/images/filter-icon/icon-type-sorcerer.png"
                                        alt="ソーサラー">
                                </button>
                            </div>
                        </div>

                    </div>

                    <!-- 👥 キャラクター一覧グリッド（純粋なアイコン用箱） -->
                    <div class="user-char-grid" id="userCharGrid">
                        <div class="character-grid__loading">キャラクターデータを読み込み中...</div>
                    </div>

                </div>

                <!-- =========================================================================
                     🔲 ユーザー専用：キャラクター性能確認モーダル（BEMクリーンアップ・安全設計）
                     ========================================================================= -->
                <div id="userCharDetailModal" class="c-modal c-world-modal" aria-hidden="true" inert>
                    <!-- 遮断幕（背景クリックで閉じる用） -->
                    <div class="c-modal__overlay js-user-char-modal-close"></div>

                    <!-- モーダルメインコンテナ -->
                    <div class="c-modal__container  p-character-modal__container ">

                        <!-- ヘッダー：プロファイル情報 -->
                        <header class="c-world-modal__header p-character-modal__header">
                            <div class="c-world-modal__title-wrap">
                                <i class="fa-solid fa-address-card"></i>
                                <span class="c-world-modal__title">キャラクター性能</span>
                            </div>
                            <button type="button"
                                class="c-world-modal__close-btn js-user-char-modal-close">&times;</button>
                        </header>

                        <!-- 専用武器・装備状態切り替えタブバー -->
                        <div class="c-world-modal__content p-character-modal__content">
                            <div class="c-filter__flex">
                                <button type="button" class="c-world-modal__filter-btn" id="ubtn-wp-normal">通常時</button>
                                <button type="button" class="c-world-modal__filter-btn" id="ubtn-wp-asta">サタン</button>
                                <button type="button" class="c-world-modal__filter-btn" id="ubtn-wp-mika">ミカエル</button>
                                <button type="button" class="c-world-modal__filter-btn" id="ubtn-wp-meta">メタトロン</button>
                            </div>
                        </div>

                        <!-- コンテンツボディ（左右2カラム構成） -->
                        <div class="c-world-modal__content m-char-detail-body">

                            <!-- 【左カラム】：アバター・レアリティ選択 ＆ パラメータ・専用武器表示 -->
                            <div class="c-char-detail__side-col">

                                <!-- アバターとレアリティセレクトを集約 -->
                                <div class="c-char-detail__profile-card">
                                    <img src="" id="ucd-avatar" class="c-char-detail__avatar-large" alt="アバター">
                                    <div class="c-char-detail__profile-meta">
                                        <h3 id="ucd-name" class="c-char-detail__name">キャラクター名</h3>
                                        <div class="c-char-detail__badge-row">
                                            <span id="ucd-attr" class="c-world-modal__btn-name">属性</span>
                                            <span id="ucd-type" class="c-world-modal__btn-name">タイプ</span>
                                            <span id="ucd-rarity" class="c-world-modal__btn-name">限定</span>
                                        </div>
                                        <span id="ucd-tags-display" class="c-char-detail__tags"></span>
                                    </div>

                                    <!-- プラスマイナスボタンによるレアリティ変更UI -->
                                    <div class="c-form__group m-modal-select-wrap">
                                        <label class="c-form__label">所持レアリティ設定</label>
                                        <div class="c-rarity-control">
                                            <button type="button" id="js-modal-rarity-minus"
                                                class="c-rarity-control__btn m-minus" aria-label="レアリティを下げる">
                                                <i class="fa-solid fa-minus"></i>
                                            </button>
                                            <span id="js-modal-rarity-display"
                                                class="c-rarity-control__display">未所持</span>
                                            <button type="button" id="js-modal-rarity-plus"
                                                class="c-rarity-control__btn m-plus" aria-label="レアリティを上げる">
                                                <i class="fa-solid fa-plus"></i>
                                            </button>
                                        </div>
                                    </div>

                                </div>

                                <!-- OFFENSE パラメータ -->
                                <div class="c-char-detail__stat-box">
                                    <div class="c-char-detail__stat-heading m-danger"><i class="fa-solid fa-burst"></i>
                                        OFFENSE
                                    </div>
                                    <div class="c-char-detail__stat-grid">
                                        <div class="c-char-detail__stat-row"><span
                                                class="c-char-detail__stat-label">スピード</span><span
                                                id="uc-calculated-speed" class="c-char-detail__stat-val">-</span></div>
                                        <div class="c-char-detail__stat-row"><span
                                                class="c-char-detail__stat-label">攻撃力</span><span id="uc-calculated-atk"
                                                class="c-char-detail__stat-val">-</span></div>
                                        <div class="c-char-detail__stat-row"><span
                                                class="c-char-detail__stat-label">命中</span><span id="uc-calculated-hit"
                                                class="c-char-detail__stat-val">-</span></div>
                                        <div class="c-char-detail__stat-row"><span
                                                class="c-char-detail__stat-label">クリティカル</span><span
                                                id="uc-calculated-crit" class="c-char-detail__stat-val">-</span></div>
                                        <div class="c-char-detail__stat-row m-last"><span
                                                class="c-char-detail__stat-label">弱体効果命中</span><span
                                                id="uc-calculated-debuff" class="c-char-detail__stat-val">-</span></div>
                                    </div>
                                </div>

                                <!-- DEFENSE パラメータ -->
                                <div class="c-char-detail__stat-box">
                                    <div class="c-char-detail__stat-heading m-success"><i
                                            class="fa-solid fa-shield-halved"></i>
                                        DEFENSE</div>
                                    <div class="c-char-detail__stat-grid">
                                        <div class="c-char-detail__stat-row"><span
                                                class="c-char-detail__stat-label">HP</span><span id="uc-calculated-hp"
                                                class="c-char-detail__stat-val">-</span></div>
                                        <div class="c-char-detail__stat-row"><span
                                                class="c-char-detail__stat-label">防御力</span><span id="uc-calculated-def"
                                                class="c-char-detail__stat-val">-</span></div>
                                        <div class="c-char-detail__stat-row"><span
                                                class="c-char-detail__stat-label">物理防御力</span><span
                                                id="uc-calculated-pdef" class="c-char-detail__stat-val">-</span></div>
                                        <div class="c-char-detail__stat-row"><span
                                                class="c-char-detail__stat-label">魔法防御力</span><span
                                                id="uc-calculated-mdef" class="c-char-detail__stat-val">-</span></div>
                                        <div class="c-char-detail__stat-row"><span
                                                class="c-char-detail__stat-label">回避</span><span
                                                id="uc-calculated-evade" class="c-char-detail__stat-val">-</span></div>
                                        <div class="c-char-detail__stat-row m-last"><span
                                                class="c-char-detail__stat-label">クリ耐性</span><span
                                                id="uc-calculated-critres" class="c-char-detail__stat-val">-</span>
                                        </div>
                                    </div>
                                </div>

                                <!-- 専用武器情報 -->
                                <div class="c-char-detail__stat-box">
                                    <div class="c-char-detail__stat-heading m-accent"><i
                                            class="fa-solid fa-wand-sparkles"></i>
                                        専用武器</div>
                                    <div id="uc-v-weapon-area" class="c-char-detail__weapon-area">
                                        <div id="uc-v-w-name" class="c-world-modal__btn-name">未装備</div>
                                        <span id="uc-v-w-val">固有値: -</span>
                                        <span id="uc-v-w-passives-lbl" class="c-form__label">専用パッシブ効果</span>
                                        <ul id="uc-v-w-passives" class="c-world-form__help"></ul>
                                    </div>
                                </div>
                            </div>

                            <!-- 【右カラム】：4大スキル詳細表示ボックス -->
                            <div class="c-char-detail__main-col">
                                <div class="c-char-detail__skill-box">
                                    <div class="c-char-detail__skill-header"><span id="uc-sk-A1-name"
                                            class="c-world-modal__btn-name">-</span><span
                                            class="c-world-modal__btn-world">ACTIVE 1</span><span id="uc-sk-A1-ct-area"
                                            class="c-world-modal__ct"></span>
                                    </div>
                                    <div id="uc-sk-A1-text" class="c-world-form__help"></div>
                                </div>
                                <div class="c-char-detail__skill-box">
                                    <div class="c-char-detail__skill-header"><span id="uc-sk-A2-name"
                                            class="c-world-modal__btn-name">-</span><span
                                            class="c-world-modal__btn-world">ACTIVE 2</span><span id="uc-sk-A2-ct-area"
                                            class="c-world-modal__ct"></span>
                                    </div>
                                    <div id="uc-sk-A2-text" class="c-world-form__help"></div>
                                </div>
                                <div class="c-char-detail__skill-box">
                                    <div class="c-char-detail__skill-header"><span id="uc-sk-P1-name"
                                            class="c-world-modal__btn-name">-</span><span
                                            class="c-world-modal__btn-world">PASSIVE 1</span><span
                                            id="uc-sk-P1-ct-area"></span>
                                    </div>
                                    <div id="uc-sk-P1-text" class="c-world-form__help"></div>
                                </div>
                                <div class="c-char-detail__skill-box">
                                    <div class="c-char-detail__skill-header"><span id="uc-sk-P2-name"
                                            class="c-world-modal__btn-name">-</span><span
                                            class="c-world-modal__btn-world">PASSIVE 2</span><span
                                            id="uc-sk-P2-ct-area"></span>
                                    </div>
                                    <div id="uc-sk-P2-text" class="c-world-form__help"></div>
                                </div>
                                <div class="c-char-detail__skill-box">
                                    <div class="c-char-detail__skill-header"><span id="uc-sk-WP-name"
                                            class="c-world-modal__btn-name">-</span><span
                                            class="c-world-modal__btn-world">その他</span><span
                                            id="uc-sk-WP-ct-area"></span>
                                    </div>
                                    <div id="uc-sk-WP-text" class="c-world-form__help"></div>
                                </div>
                            </div>

                        </div>

                    </div>
                </div>
                <div class="c-floating-container">
                    <div class="c-floating-inner">
                        <button type="button" id="js-character-btn-update" class="c-btn c-footer__update-btn">
                            <i class="fa-solid fa-rotate"></i> 更新する
                        </button>
                    </div>
                </div>
            </div>
        </div>



    </main>




    <!-- 外部から読み込むフッターの受け皿 -->
    <footer id="js-footer-container" class="c-footer js-footer-container">


    </footer>

</body>

</html>
