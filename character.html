<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>キャラクターページ</title>

    <!-- リセットCSS & Googleフォントやアイコンなど -->
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/destyle.css@4.0.0/destyle.min.css" />
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/character.css">
    <script src="https://kit.fontawesome.com/d36bec305b.js" crossorigin="anonymous"></script>

    <script src="assets/js/main.js" type="module"></script>
    <script src="assets/js/character.js"></script>
</head>

<body>

    <main class="c-portal ">

        <!-- =========================================================================
             🌐 ワールド×キャラクター タブコンテンツ（一般ユーザー用）
             ========================================================================= -->
        <div class="user-tab-content js-tab-content-character" id="tabCharacter">

            <!-- 🔍 フィルターセクション（画像アイコンボタン仕様） -->
            <div class="c-world-modal__content u-p-0 u-mb-16" style="background: none; border: none;">
                <div class="filter-section">
                    <div class="filter-row">
                        <div class="filter-label">属性</div>
                        <div class="c-world-modal__filter-flex" id="userFilterAttrOptions">
                            <!-- JSで属性画像ボタン（すべて/藍/紅/翠/黄/天/冥）が動的生成されます -->
                        </div>
                    </div>
                    <div class="filter-row">
                        <div class="filter-label">タイプ</div>
                        <div class="c-world-modal__filter-flex" id="userFilterTypeOptions">
                            <!-- JSでタイプ画像ボタン（すべて/ウォーリアー/スナイパー/ソーサラー）が動的生成されます -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- 👥 キャラクター一覧グリッド（B案仕様：純粋なアイコンのみが美しく並ぶ） -->
            <div class="user-char-grid" id="userCharGrid">
                <div class="character-grid__loading">キャラクターデータを読み込み中...</div>
            </div>

        </div>

        <!-- =========================================================================
             🔲 ユーザー専用：キャラクター性能確認モーダル（デザイン共通化・安全設計）
             ========================================================================= -->
        <div id="userCharDetailModal" class="c-modal c-world-modal" aria-hidden="true" inert>
            <!-- 遮断幕（背景クリックで閉じる用） -->
            <div class="c-modal__overlay js-user-char-modal-close"></div>

            <!-- モーダルメインコンテナ -->
            <div class="c-modal__container c-modal__container--large m-char-detail">

                <!-- ヘッダー：プロファイル情報 -->
                <header class="c-world-modal__header">
                    <div class="c-world-modal__title-wrap">
                        <i class="fa-solid fa-address-card"></i>
                        <span class="c-world-modal__title">魔女のステータス詳細</span>
                    </div>
                    <button type="button" class="c-world-modal__close-btn js-user-char-modal-close">&times;</button>
                </header>

                <!-- 専用武器・装備状態切り替えタブバー -->
                <div class="c-world-modal__content u-pb-0"
                    style="border-bottom: 1px solid var(--border-color); background: var(--bg-card);">
                    <div class="c-world-modal__filter-flex u-mb-8">
                        <button type="button" class="c-world-modal__filter-btn" id="ubtn-wp-normal"
                            style="font-size:12px; font-weight:bold; width:auto; padding:0 16px;">通常時</button>
                        <button type="button" class="c-world-modal__filter-btn" id="ubtn-wp-asta"
                            style="font-size:12px; font-weight:bold; width:auto; padding:0 16px;">サタン</button>
                        <button type="button" class="c-world-modal__filter-btn" id="ubtn-wp-mika"
                            style="font-size:12px; font-weight:bold; width:auto; padding:0 16px;">ミカエル</button>
                        <button type="button" class="c-world-modal__filter-btn" id="ubtn-wp-meta"
                            style="font-size:12px; font-weight:bold; width:auto; padding:0 16px;">メタトロン</button>
                    </div>
                </div>

                <!-- コンテンツボディ（左右2カラム構成） -->
                <div class="c-world-modal__content m-char-detail-body">

                    <!-- 【左カラム】：アバター・レアリティ選択 ＆ パラメータ・専用武器表示 -->
                    <div class="c-char-detail__side-col">

                        <!-- アバターとレアリティセレクトを集約 -->
                        <div class="c-char-detail__profile-card">
                            <img src="" id="ucd-avatar" class="c-char-detail__avatar-large" alt="アバター" />
                            <div class="c-char-detail__profile-meta">
                                <h3 id="ucd-name" class="c-char-detail__name">キャラクター名</h3>
                                <div class="c-char-detail__badge-row">
                                    <span id="ucd-attr" class="c-world-modal__btn-world"
                                        style="background: var(--bg-dark); padding:2px 6px; border-radius:4px; font-size:10px;">属性</span>
                                    <span id="ucd-type" class="c-world-modal__btn-world"
                                        style="background: var(--bg-dark); padding:2px 6px; border-radius:4px; font-size:10px;">タイプ</span>
                                    <span id="ucd-rarity" class="c-world-modal__btn-name"
                                        style="font-size:11px; color:var(--text-muted);">限定</span>
                                </div>
                                <span id="ucd-tags-display" class="c-char-detail__tags"></span>
                            </div>

                            <!-- 📥 移動したレアリティセレクトボックス -->
                            <div class="c-form__group u-w-100 u-mt-12">
                                <label class="c-form__label u-mb-4"
                                    style="font-size:11px; color:var(--text-muted);">所持レアリティ設定</label>
                                <select id="js-modal-user-rarity-select" class="c-form__input"
                                    style="padding: 6px 12px; font-size: 13px; font-weight: bold; background-color: var(--bg-dark); text-align: center;"></select>
                            </div>
                        </div>

                        <!-- OFFENSE パラメータ -->
                        <div class="c-char-detail__stat-box">
                            <div class="c-char-detail__stat-heading m-danger"><i class="fa-solid fa-burst"></i> OFFENSE
                            </div>
                            <div class="c-char-detail__stat-grid">
                                <div class="c-char-detail__stat-row"><span
                                        class="c-char-detail__stat-label">スピード</span><span id="uc-calculated-speed"
                                        class="c-char-detail__stat-val">-</span></div>
                                <div class="c-char-detail__stat-row"><span
                                        class="c-char-detail__stat-label">攻撃力</span><span id="uc-calculated-atk"
                                        class="c-char-detail__stat-val">-</span></div>
                                <div class="c-char-detail__stat-row"><span
                                        class="c-char-detail__stat-label">命中</span><span id="uc-calculated-hit"
                                        class="c-char-detail__stat-val">-</span></div>
                                <div class="c-char-detail__stat-row"><span
                                        class="c-char-detail__stat-label">クリティカル</span><span id="uc-calculated-crit"
                                        class="c-char-detail__stat-val">-</span></div>
                                <div class="c-char-detail__stat-row m-last"><span
                                        class="c-char-detail__stat-label">弱体効果命中</span><span id="uc-calculated-debuff"
                                        class="c-char-detail__stat-val">-</span></div>
                            </div>
                        </div>

                        <!-- DEFENSE パラメータ -->
                        <div class="c-char-detail__stat-box">
                            <div class="c-char-detail__stat-heading m-success"><i class="fa-solid fa-shield-halved"></i>
                                DEFENSE</div>
                            <div class="c-char-detail__stat-grid">
                                <div class="c-char-detail__stat-row"><span
                                        class="c-char-detail__stat-label">HP</span><span id="uc-calculated-hp"
                                        class="c-char-detail__stat-val">-</span></div>
                                <div class="c-char-detail__stat-row"><span
                                        class="c-char-detail__stat-label">防御力</span><span id="uc-calculated-def"
                                        class="c-char-detail__stat-val">-</span></div>
                                <div class="c-char-detail__stat-row"><span
                                        class="c-char-detail__stat-label">物理防御力</span><span id="uc-calculated-pdef"
                                        class="c-char-detail__stat-val">-</span></div>
                                <div class="c-char-detail__stat-row"><span
                                        class="c-char-detail__stat-label">魔法防御力</span><span id="uc-calculated-mdef"
                                        class="c-char-detail__stat-val">-</span></div>
                                <div class="c-char-detail__stat-row"><span
                                        class="c-char-detail__stat-label">回避</span><span id="uc-calculated-evade"
                                        class="c-char-detail__stat-val">-</span></div>
                                <div class="c-char-detail__stat-row m-last"><span
                                        class="c-char-detail__stat-label">クリ耐性</span><span id="uc-calculated-critres"
                                        class="c-char-detail__stat-val">-</span></div>
                            </div>
                        </div>

                        <!-- 専用武器情報 -->
                        <div class="c-char-detail__stat-box">
                            <div class="c-char-detail__stat-heading m-accent"><i class="fa-solid fa-wand-sparkles"></i>
                                専用武器</div>
                            <div id="uc-v-weapon-area" class="c-char-detail__weapon-area">
                                <div id="uc-v-w-name" class="c-world-modal__btn-name"
                                    style="font-size:13px; font-weight:bold; color:var(--text-color);">未装備</div>
                                <span id="uc-v-w-val"
                                    style="font-size:11px; color:var(--accent-color); font-weight:bold;">固有値: -</span>
                                <span id="uc-v-w-passives-lbl" class="c-form__label u-mt-8 u-mb-4"
                                    style="font-size:11px; display:block;">専用パッシブ効果</span>
                                <ul id="uc-v-w-passives" class="c-world-form__help"
                                    style="list-style:none; padding-left:0; display:flex; flex-direction:column; gap:4px;">
                                </ul>
                            </div>
                        </div>
                    </div>

                    <!-- 【右カラム】：4大スキル詳細表示ボックス -->
                    <div class="c-char-detail__main-col">
                        <div class="c-char-detail__skill-box">
                            <div class="c-char-detail__skill-header"><span id="uc-sk-A1-name"
                                    class="c-world-modal__btn-name"
                                    style="font-size:14px; font-weight:bold;">-</span><span
                                    class="c-world-modal__btn-world"
                                    style="background:var(--bg-dark); font-size:10px; padding:2px 6px; border-radius:4px; color:var(--text-muted);">ACTIVE
                                    1</span><span id="uc-sk-A1-ct-area"></span></div>
                            <div id="uc-sk-A1-text" class="c-world-form__help"
                                style="font-size:13px; line-height:1.6; color:var(--text-color);"></div>
                        </div>
                        <div class="c-char-detail__skill-box">
                            <div class="c-char-detail__skill-header"><span id="uc-sk-A2-name"
                                    class="c-world-modal__btn-name"
                                    style="font-size:14px; font-weight:bold;">-</span><span
                                    class="c-world-modal__btn-world"
                                    style="background:var(--bg-dark); font-size:10px; padding:2px 6px; border-radius:4px; color:var(--text-muted);">ACTIVE
                                    2</span><span id="uc-sk-A2-ct-area"></span></div>
                            <div id="uc-sk-A2-text" class="c-world-form__help"
                                style="font-size:13px; line-height:1.6; color:var(--text-color);"></div>
                        </div>
                        <div class="c-char-detail__skill-box">
                            <div class="c-char-detail__skill-header"><span id="uc-sk-P1-name"
                                    class="c-world-modal__btn-name"
                                    style="font-size:14px; font-weight:bold;">-</span><span
                                    class="c-world-modal__btn-world"
                                    style="background:var(--bg-dark); font-size:10px; padding:2px 6px; border-radius:4px; color:var(--text-muted);">PASSIVE
                                    1</span><span id="uc-sk-P1-ct-area"></span></div>
                            <div id="uc-sk-P1-text" class="c-world-form__help"
                                style="font-size:13px; line-height:1.6; color:var(--text-color);"></div>
                        </div>
                        <div class="c-char-detail__skill-box">
                            <div class="c-char-detail__skill-header"><span id="uc-sk-P2-name"
                                    class="c-world-modal__btn-name"
                                    style="font-size:14px; font-weight:bold;">-</span><span
                                    class="c-world-modal__btn-world"
                                    style="background:var(--bg-dark); font-size:10px; padding:2px 6px; border-radius:4px; color:var(--text-muted);">PASSIVE
                                    2</span><span id="uc-sk-P2-ct-area"></span></div>
                            <div id="uc-sk-P2-text" class="c-world-form__help"
                                style="font-size:13px; line-height:1.6; color:var(--text-color);"></div>
                        </div>
                        <div class="c-char-detail__skill-box">
                            <div class="c-char-detail__skill-header"><span id="uc-sk-WP-name"
                                    class="c-world-modal__btn-name"
                                    style="font-size:14px; font-weight:bold;">-</span><span
                                    class="c-world-modal__btn-world"
                                    style="background:var(--bg-dark); font-size:10px; padding:2px 6px; border-radius:4px; color:var(--text-muted);">その他</span><span
                                    id="uc-sk-WP-ct-area"></span></div>
                            <div id="uc-sk-WP-text" class="c-world-form__help"
                                style="font-size:13px; line-height:1.6; color:var(--text-color);"></div>
                        </div>
                    </div>

                </div>

            </div>
        </div>

    </main>




    <!-- 外部から読み込むフッターの受け皿 -->
    <footer id="js-footer-container" class="c-footer js-footer-container">


    </footer>

</body>

</html>
