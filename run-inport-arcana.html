        async function startImport() {
            console.log("🚀 アルカナマスタのインポート処理を開始します...");
            let successCount = 0;

            // データの配列を安全に取得
            const targetList = arcanaSpreadsheetData;

            for (let i = 0; i < targetList.length; i++) {
                const item = targetList[i];
                if (!item || !item.id) continue;

                // 💡 保存先のコレクションとドキュメントIDを指定（item.id を使用）
                const docRef = doc(db, "arcana_master", String(item.id));

                // 💡 Firestoreの実際のデータ構造に合わせて1項目ずつ安全に整形
                const arcanaDoc = {
                    id: String(item.id),
                    name: String(item.name || ""),
                    charId1: String(item.charId1 || ""),
                    charId2: String(item.charId2 || ""),
                    charId3: String(item.charId3 || ""),
                    charId4: String(item.charId4 || ""),
                    effect: String(item.effect || ""),
                    tags: String(item.tags || "")
                };

                try {
                    // 🚀 Firestoreへ上書き保存
                    await setDoc(docRef, arcanaDoc);
                    console.log(`✅ アルカナID: ${item.id} (${item.name}) のインポート成功`);
                    successCount++;
                } catch (error) {
                    console.error(`❌ アルカナID: ${item.id} のインポート失敗:`, error);
                }
            }

            console.log(`✨ すべての処理が完了しました！ 成功件数: ${successCount} / ${targetList.length}`);
            alert(`✨ アルカナマスタのインポートが完了しました！\n成功件数: ${successCount} 件`);
        }

        // ページが開かれたら自動実行
        startImport();

    </script>
