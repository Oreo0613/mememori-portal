<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ウルトラセール｜メメモリ</title>


  <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/destyle.css@4.0.0/destyle.min.css" />
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pack-manager.css">
  <script src="https://kit.fontawesome.com/d36bec305b.js" crossorigin="anonymous"></script>


  <script src="assets/js/main.js" type="module"></script>
</head>

<body>
  <div class="l-container l-container--wide">
    <header class="l-header c-floating-header">
      <div id="js-world-selector-container" class="c-main__header js-header-container"></div>
    </header>
    <main class="l-main">
      <div class="p-pack-manager">

        <!-- 🎯 エリア①：直近の到達予定パック（常設・最上部） -->
        <section class="p-pack-manager__section">
          <h2 class="p-pack-manager__title">
            <span class="p-pack-manager__title-icon">🎯</span>直近の到達予定パック
          </h2>
          <div class="p-pack-board js-pack-urgent-board"></div>
        </section>

        <!-- ⏳ エリア②：今後の未達成パック（独立アコーディオン） -->
        <section class="p-pack-manager__section">
          <button class="p-pack-accordion-trigger js-archive-toggle" aria-expanded="false" data-target="future">
            <span class="p-pack-accordion-trigger__text">
              <i class="fa-solid fa-hourglass-half"></i>今後の未達成パック
            </span>
            <span class="p-pack-accordion-trigger__icon js-archive-icon">▼</span>
          </button>
          <div class="p-pack-accordion-content p-pack-board js-pack-future-board" id="board-future">
            <!-- 4番目以降の未達成パックがここに横並び -->
          </div>
        </section>

        <!-- ✅ エリア③：獲得・達成済みパック（独立アコーディオン） -->
        <section class="p-pack-manager__section">
          <button class="p-pack-accordion-trigger p-pack-accordion-trigger--completed js-archive-toggle"
            aria-expanded="false" data-target="completed">
            <span class="p-pack-accordion-trigger__text">
              <i class="fa-solid fa-circle-check"></i>獲得・達成済みのパック
            </span>
            <span class="p-pack-accordion-trigger__icon js-archive-icon">▼</span>
          </button>
          <div class="p-pack-accordion-content p-pack-board js-pack-completed-board" id="board-completed">
            <!-- 達成済みの全パックがここに横並び -->
          </div>
        </section>

        <div class="c-update-btn__wrapper">
          <div class="c-update-btn__wrap">
            <button type="button" id="js-pack-btn-update" class="c-btn c-update-btn">
              <i class="fa-solid fa-rotate"></i> 更新する
            </button>
            <button id="scrollToTopBtn" class="scroll-to-top-btn" title="トップへ戻る">↑</button>
          </div>
        </div>

      </div>


    </main>
  </div>

  <div class="l-sidebar"></div>

  <!-- 外部から読み込むフッターの受け皿 -->
  <footer id="js-footer-container" class="l-footer js-footer-container"></footer>

  <script src="assets/js/pack-manager.js"></script>
</body>

</html>
